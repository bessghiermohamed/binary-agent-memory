<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بيناري — عقل يسمعك من المتصفح</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🧠</text></svg>">
<style>
:root{
  --bg:#0b0f16; --panel:#111722; --panel2:#1a2233; --panel3:#232d44;
  --line:#28324a; --text:#e9eef7; --dim:#8b95a8;
  --accent:#5b9dff; --accent2:#7c5bff; --ok:#3fb950; --warn:#d29922; --err:#f85149;
}
[data-theme=light]{
  --bg:#f3f5fa; --panel:#ffffff; --panel2:#eef1f8; --panel3:#e2e8f4;
  --line:#d5dcec; --text:#1a2333; --dim:#5d6b85;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;transition:background .3s,color .3s}
header{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
header .dot{width:10px;height:10px;border-radius:50%;background:var(--warn);box-shadow:0 0 10px var(--warn);transition:.3s}
header .dot.ok{background:var(--ok);box-shadow:0 0 10px var(--ok)}
header h1{font-size:17px;margin:0;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
header .sub{color:var(--dim);font-size:11.5px}
header .spacer{flex:1}
.iconbtn{background:var(--panel2);border:1px solid var(--line);color:var(--dim);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
.iconbtn:hover{color:var(--text);border-color:var(--accent)}
main{flex:1;display:grid;grid-template-columns:1fr 300px;min-height:0}
#chat{display:flex;flex-direction:column;min-height:0;border-inline-end:1px solid var(--line)}
#log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.msg{max-width:82%;padding:10px 14px;border-radius:16px;line-height:1.7;word-break:break-word;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.owner{align-self:flex-start;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-bottom-right-radius:5px}
.msg.agent{align-self:flex-end;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg .who{display:flex;gap:8px;align-items:center;font-size:10.5px;color:var(--dim);margin-bottom:4px}
.msg.owner .who{color:rgba(255,255,255,.75)}
.msg .who .mini{margin-inline-start:auto;display:none;gap:4px}
.msg:hover .who .mini{display:flex}
.msg .mini button{background:none;border:0;color:inherit;cursor:pointer;font-size:10.5px;padding:0;opacity:.8}
.msg .mini button:hover{opacity:1;text-decoration:underline}
.msg .md{white-space:pre-wrap}
.msg .md b,.msg .md strong{font-weight:700}
.msg .md code{background:var(--panel3);border-radius:5px;padding:1px 6px;font-size:.92em;direction:ltr;display:inline-block}
.msg .md pre{background:var(--panel3);border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;direction:ltr;text-align:left;white-space:pre}
.msg .md a{color:var(--accent)}
.msg .md ul{margin:4px 0;padding-inline-start:18px}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.tooltag{display:inline-block;font-size:10.5px;background:var(--panel3);border:1px solid var(--line);color:var(--dim);border-radius:99px;padding:1px 9px;margin-top:6px}
.hints{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 8px}
.hints button{background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-size:11.5px;padding:5px 11px;border-radius:99px;cursor:pointer}
.hints button:hover{color:var(--text);border-color:var(--accent)}
form{display:flex;gap:8px;padding:10px 16px 14px}
input[type=text]{flex:1;background:var(--panel2);border:1.5px solid var(--line);color:var(--text);border-radius:12px;padding:11px 15px;font-size:14px;outline:none;transition:border .2s}
input[type=text]:focus{border-color:var(--accent)}
#send{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#fff;border-radius:12px;padding:11px 20px;font-size:14px;cursor:pointer;transition:filter .2s}
#send:hover{filter:brightness(1.15)}#send:disabled{opacity:.5;cursor:wait}
aside{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px;background:var(--panel)}
aside h2{font-size:12.5px;margin:0 0 7px;color:var(--dim);font-weight:600;letter-spacing:.3px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px;font-size:12.5px}
.card .row{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line)}
.card .row:last-child{border-bottom:0}
.pill{font-size:10.5px;padding:2px 9px;border-radius:99px;background:var(--warn);color:#000}
.pill.ok{background:var(--ok)}
.approval .btns{display:flex;gap:8px;margin-top:8px}
.yes{background:var(--ok)}.no{background:var(--err)}
.approval .btns button{flex:1;border:0;color:#fff;border-radius:8px;padding:7px;font-size:12.5px;cursor:pointer}
.kv{color:var(--dim);font-size:11.5px}
.empty{color:var(--dim);font-size:11.5px;text-align:center;padding:8px}
@media(max-width:860px){main{grid-template-columns:1fr}aside{display:none}}
</style>
</head>
<body>
<header>
  <div class="dot" id="dot"></div>
  <div>
    <h1>بيناري</h1>
    <div class="sub">عقل يسمعك من المتصفح — بحث ويب، ذاكرة، وأدوات، بلا كذب</div>
  </div>
  <div class="spacer"></div>
  <button class="iconbtn" id="theme" title="تبديل الثيم">◐</button>
  <button class="iconbtn" id="clear" title="مسح الشاشة">🧹</button>
</header>
<main>
  <section id="chat">
    <div id="log"></div>
    <div class="hints">
      <button data-t="حالة">حالة</button>
      <button data-t="ملخص">ملخص</button>
      <button data-t="موافقات">الموافقات</button>
      <button data-t="ابحث عن ">🔍 ابحث…</button>
      <button data-t="هدف: ">هدف جديد</button>
    </div>
    <form id="f">
      <input type="text" id="t" placeholder="اكتب إلى بيناري… (Enter للإرسال)" autocomplete="off" required>
      <button id="send">إرسال</button>
    </form>
  </section>
  <aside>
    <div><h2>عقله اللغوي</h2><div class="card" id="brain"><div class="empty">…</div></div></div>
    <div><h2>أهدافه المفتوحة</h2><div class="card" id="goals"><div class="empty">…</div></div></div>
    <div><h2>بانتظار قرارك</h2><div class="card approval" id="approvals"><div class="empty">…</div></div></div>
    <div><h2>ذاكرته</h2><div class="card" id="mem"><div class="empty">…</div></div></div>
  </aside>
</main>
<script>
const log=document.getElementById('log'), t=document.getElementById('t'),
      send=document.getElementById('send'), f=document.getElementById('f'), dot=document.getElementById('dot');
let history=[];

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function md(s){
  let h=esc(s);
  h=h.replace(/```([\s\S]*?)```/g,(m,c)=>'<pre>'+c.replace(/^\n|\n$/g,'')+'</pre>');
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  h=h.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  h=h.replace(/(^|\n)###?\s*(.+)/g,'$1<b>$2</b>');
  h=h.replace(/(^|\n)[\-\u2022]\s+(.+)/g,'$1• $2');
  h=h.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  h=h.replace(/(^|[\s>])(https?:\/\/[^\s<]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return '<span class="md">'+h+'</span>';
}
function add(role,text,src){
  const d=document.createElement('div'); d.className='msg '+role;
  const who=role==='owner'?'أنت':'بيناري'+(src?' · '+esc(src):'');
  d.innerHTML='<span class="who"><span>'+who+'</span><span class="mini">'
    +(role==='agent'?'<button onclick="retry()">↻ إعادة</button>':'')
    +'<button onclick="copyMsg(this)">نسخ</button></span></span>'
    +(role==='owner'?esc(text):md(text));
  log.appendChild(d); log.scrollTop=log.scrollHeight;
  if(role==='agent'&&!src) history.push({role:'agent',text});
  return d;
}
window.copyMsg=btn=>{
  const txt=btn.closest('.msg').querySelector('.md,span:last-child')?.innerText||btn.closest('.msg').innerText;
  navigator.clipboard.writeText(txt.replace(/^[^]*?\n/,''));
};
window.retry=()=>{
  const lastOwner=[...document.querySelectorAll('.msg.owner .md, .msg.owner span:last-child')].pop();
  if(lastOwner){ t.value=lastOwner.innerText; f.requestSubmit(); }
};
function typing(){
  const d=document.createElement('div'); d.className='msg agent';
  d.innerHTML='<span class="who">بيناري</span><span class="typing"><i></i><i></i><i></i></span>';
  log.appendChild(d); log.scrollTop=log.scrollHeight; return d;
}
async function api(path,opts){
  const r=await fetch(path,opts); const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||r.status); return j;
}
async function ping(){
  try{ const h=await api('/api/health'); dot.classList.toggle('ok',!!h.ok);
    const b=await api('/api/brain');
    document.getElementById('brain').innerHTML=
      '<div class="row"><span>العقل اللغوي</span><span class="pill'+(b.llm_enabled?' ok':'')+'">'+(b.llm_enabled?'حي':'معطّل')+'</span></div>'
     +'<div class="kv" style="margin-top:6px">أدواته: '+esc((b.tools||[]).join('، '))+'</div>'
     +'<div class="kv">مفاتيح بيئة: '+((b.env_keys_present||[]).length?esc(b.env_keys_present.join('، ')):'لا شيء')+'</div>';
    const s=await api('/api/state'); const g=document.getElementById('goals');
    g.innerHTML=s.goals.length?s.goals.map(x=>'<div class="row"><span>'+esc(x.title)+'</span><span class="kv">'+esc(x.id)+'</span></div>').join(''):'<div class="empty">لا أهداف مفتوحة</div>';
    const a=document.getElementById('approvals');
    a.innerHTML=s.pending.length?s.pending.map(p=>'<div class="row"><span>'+esc(p.reason)+'</span><span class="pill">'+esc(p.id)+'</span></div>'
      +'<div class="btns"><button class="yes" onclick="decide(\''+p.id+'\',\'yes\')">نعم</button><button class="no" onclick="decide(\''+p.id+'\',\'no\')">لا</button></div>').join('')
      :'<div class="empty">لا شيء ينتظر قرارك</div>';
    const c=s.counters||{};
    document.getElementById('mem').innerHTML=
      '<div class="row"><span>حلقات</span><span>'+esc(c.episodes??'?')+'</span></div>'
     +'<div class="row"><span>دروس</span><span>'+esc(c.insights??'?')+'</span></div>'
     +'<div class="row"><span>توقيتي</span><span>'+esc(s.timezone)+'</span></div>';
  }catch(e){ dot.classList.remove('ok'); }
}
async function decide(id,decision){
  try{ const j=await api('/api/approvals/'+id+'/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision})});
    add('agent','قرارك على '+id+':\n'+j.result); ping();
  }catch(e){ add('agent','فشل القرار: '+e.message); }
}
f.addEventListener('submit',async e=>{
  e.preventDefault(); const text=t.value.trim(); if(!text||send.disabled) return;
  add('owner',text); history.push({role:'owner',text}); t.value=''; send.disabled=true;
  const tp=typing();
  try{
    const j=await api('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
    const m=/— عبر (.+)$/.exec(j.reply||''); const src=m?m[1]:null;
    const body=(j.reply||'').replace(/\n\n— عبر .+$/,'');
    tp.remove(); add('agent',body,src);
  }catch(err){
    tp.remove();
    add('agent','تعذّر الوصول: '+err.message+'\nالأوامر المحلية تعمل: حالة، ملخص، موافقات، هدف: …');
  }
  finally{ send.disabled=false; t.focus(); ping(); }
});
document.querySelectorAll('.hints button').forEach(b=>b.addEventListener('click',()=>{t.value=b.dataset.t;t.focus();if(b.dataset.t.endsWith(' '))return;f.requestSubmit();}));
document.getElementById('theme').addEventListener('click',()=>{
  const cur=document.body.dataset.theme==='light'?'dark':'light';
  document.body.dataset.theme=cur; localStorage.setItem('binaary_theme',cur);
});
document.getElementById('clear').addEventListener('click',()=>{log.innerHTML='';});
if(localStorage.getItem('binaary_theme')==='light') document.body.dataset.theme='light';
ping(); setInterval(ping,20000);
</script>
</body>
</html>
