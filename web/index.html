<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بيناري — عقلي في متصفحك</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2d3748;
  --text:#e6edf3; --dim:#8b949e; --accent:#4f8cff; --ok:#3fb950; --warn:#d29922; --err:#f85149;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
header .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
header h1{font-size:18px;margin:0}
header .sub{color:var(--dim);font-size:12px}
main{flex:1;display:grid;grid-template-columns:1fr 320px;gap:0;min-height:0}
#chat{display:flex;flex-direction:column;min-height:0;border-inline-end:1px solid var(--line)}
#log{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;padding:10px 14px;border-radius:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg.owner{align-self:flex-start;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.agent{align-self:flex-end;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .who{display:block;font-size:11px;color:var(--dim);margin-bottom:4px}
form{display:flex;gap:8px;padding:12px 16px;background:var(--panel);border-top:1px solid var(--line)}
input[type=text]{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 14px;font-size:14px;outline:none}
input[type=text]:focus{border-color:var(--accent)}
button{background:var(--accent);border:0;color:#fff;border-radius:10px;padding:10px 18px;font-size:14px;cursor:pointer}
button:hover{filter:brightness(1.1)}
button:disabled{opacity:.5;cursor:wait}
aside{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;background:var(--panel)}
aside h2{font-size:14px;margin:0 0 8px;color:var(--dim);font-weight:600}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px}
.card .row{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line)}
.card .row:last-child{border-bottom:0}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--warn);color:#000}
.approval{border-color:var(--warn)}
.approval .btns{display:flex;gap:8px;margin-top:8px}
.yes{background:var(--ok)} .no{background:var(--err)}
.kv{color:var(--dim);font-size:12px}
.empty{color:var(--dim);font-size:12px;text-align:center;padding:8px}
@media(max-width:800px){main{grid-template-columns:1fr}aside{display:none}}
.hints{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px;background:var(--panel)}
.hints button{background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-size:12px;padding:5px 10px}
.hints button:hover{color:var(--text);border-color:var(--accent)}
</style>
</head>
<body>
<header>
  <div class="dot" id="dot"></div>
  <div>
    <h1>بيناري</h1>
    <div class="sub">عقلي في هذا المستودع — وقناتنا معك الآن هذه الصفحة، لا تيليجرام</div>
  </div>
</header>
<main>
  <section id="chat">
    <div id="log"></div>
    <div class="hints">
      <button data-t="حالة">حالة</button>
      <button data-t="ملخص">ملخص اليوم</button>
      <button data-t="موافقات">الموافقات</button>
      <button data-t="هدف: ">هدف جديد…</button>
    </div>
    <form id="f">
      <input type="text" id="t" placeholder="اكتب لبيناري…" autocomplete="off" required>
      <button id="send">إرسال</button>
    </form>
  </section>
  <aside>
    <div>
      <h2>أهداف مفتوحة</h2>
      <div class="card" id="goals"><div class="empty">…</div></div>
    </div>
    <div>
      <h2>بانتظار قرارك</h2>
      <div class="card" id="approvals"><div class="empty">…</div></div>
    </div>
    <div>
      <h2>ذاكرته</h2>
      <div class="card" id="mem"><div class="empty">…</div></div>
    </div>
  </aside>
</main>
<script>
const log=document.getElementById('log'), t=document.getElementById('t'),
      send=document.getElementById('send'), f=document.getElementById('f');

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function add(role,text,ts){
  const d=document.createElement('div'); d.className='msg '+role;
  d.innerHTML='<span class="who">'+(role==='owner'?'أنت':'بيناري')+(ts?' · '+esc(ts):'')+'</span>'+esc(text);
  log.appendChild(d); log.scrollTop=log.scrollHeight;
}
async function api(path,opts){
  const r=await fetch(path,opts); const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||r.status); return j;
}
async function loadHistory(){
  try{
    const j=await api('/api/messages?channel=web');
    log.innerHTML='';
    j.messages.forEach(m=>add(m.role,m.text,m.ts));
    if(!j.messages.length) add('agent','أهلاً يا مراد. أنا بيناري — قناتنا معك صارت هذه الصفحة. جرّب «حالة» أو «هدف: ...».');
  }catch(e){ add('agent','تعذّر تحميل المحادثة: '+e.message); }
}
async function loadState(){
  try{
    const s=await api('/api/state');
    const g=document.getElementById('goals');
    g.innerHTML = s.goals.length
      ? s.goals.map(x=>'<div class="row"><span>'+esc(x.title)+'</span><span class="kv">'+esc(x.id)+'</span></div>').join('')
      : '<div class="empty">لا أهداف مفتوحة</div>';
    const a=document.getElementById('approvals');
    a.innerHTML = s.pending.length
      ? s.pending.map(p=>'<div class="row"><span>'+esc(p.reason)+'</span><span class="pill">'+esc(p.id)+'</span></div>'
          +'<div class="btns"><button class="yes" onclick="decide(\''+p.id+'\',\'yes\')">نعم</button>'
          +'<button class="no" onclick="decide(\''+p.id+'\',\'no\')">لا</button></div>').join('')
      : '<div class="empty">لا شيء ينتظر قرارك</div>';
    const c=s.counters||{};
    document.getElementById('mem').innerHTML =
      '<div class="row"><span>حلقات</span><span>'+esc(c.episodes??'?')+'</span></div>'
     +'<div class="row"><span>دروس</span><span>'+esc(c.insights??'?')+'</span></div>'
     +'<div class="row"><span>توقيتي</span><span>'+esc(s.timezone)+'</span></div>';
  }catch(e){ /* صمت */ }
}
async function decide(id,decision){
  try{ const j=await api('/api/approvals/'+id+'/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision})});
    add('agent','قرارك على '+id+':\n'+j.result); loadState();
  }catch(e){ add('agent','فشل القرار: '+e.message); }
}
f.addEventListener('submit',async e=>{
  e.preventDefault(); const text=t.value.trim(); if(!text) return;
  add('owner',text); t.value=''; send.disabled=true;
  try{ const j=await api('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
    add('agent',j.reply); loadState();
  }catch(err){ add('agent','خطأ: '+err.message); }
  finally{ send.disabled=false; t.focus(); }
});
document.querySelectorAll('.hints button').forEach(b=>b.addEventListener('click',()=>{t.value=b.dataset.t;t.focus();}));
loadHistory(); loadState(); setInterval(loadState,15000);
</script>
</body>
</html>
